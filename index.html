<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini-Calculatrice</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Mini-Calculatrice</h1>
      <div class="element">
        <label for="number1"> Premier nombre</label>
        <input type="number" id="number1" placeholder="0" />
        <label for="number2">Deuxième nombre</label>
        <input type="number" id="number2" placeholder="0" />
        <label for="operation">Opération</label>
        <select name="operation" id="operation">
          <option value="addition">+</option>
          <option value="soustraction">-</option>
          <option value="multiplication">*</option>
          <option value="division">/</option>
        </select>
      </div>
      <div class="bouton">
        <button type="button">Calculer</button>
      </div>
      <div class="resultat">
        <label for="resultat">Résultat</label>
        <input type="text" id="resultat" readonly />
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
